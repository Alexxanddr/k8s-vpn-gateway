name: CI
on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths-ignore: ['**/*.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
      - run: go test -race ./... && go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: test -z "$(gofmt -l cmd internal)"
      - name: Validate chart and secret exclusions
        run: |
          helm lint charts/vpn-gateway --set image=vpn:test --set clusterDNS=10.96.0.10
          helm template vpn charts/vpn-gateway --set image=vpn:test --set clusterDNS=10.96.0.10 --set 'clientNamespaces[0]=example' > /tmp/rendered.yaml
          helm template vpn charts/vpn-gateway --set image=vpn:test --set clusterDNS=10.96.0.10 --set autoEnroll=true > /tmp/automatic.yaml
          if helm template vpn charts/vpn-gateway --set image=vpn:test --set clusterDNS=10.96.0.10 --set publicDNS=10.96.0.10; then
            echo "Expected identical public and cluster DNS settings to be rejected"
            exit 1
          fi
          python3 -m py_compile tests/cluster.py tests/receiver.py
          for script in tests/*.sh; do sh -n "$script"; done
          test -z "$(git ls-files '*.conf' '*.key' '*.pem' '.env*')"
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
      - name: Acceptance test utilities
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: tests/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: BASE=${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          push: true
          tags: ${{ steps.image.outputs.name }}:test-sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: mode=max
