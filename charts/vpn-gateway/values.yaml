# Build the project image and supply an accessible immutable digest before installation.
image: ""
gluetunImage: qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
vpnSecret: vpn-provider
