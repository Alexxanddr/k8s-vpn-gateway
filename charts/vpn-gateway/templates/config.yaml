{{- $image := required "image must be set to your built image digest" .Values.image -}}
{{- $dns := required "clusterDNS must be the cluster DNS IPv4 Service address" .Values.clusterDNS -}}
{{- if eq $dns .Values.publicDNS -}}
{{- fail "publicDNS must differ from clusterDNS to prevent public DNS bypass" -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: {{ $.Release.Namespace }}
  name: vpn-gateway-config
data:
  start.sh: |
    # Remove only stale Gluetun WireGuard state in this Pod, before Gluetun starts.
    if ip link show dev tun0 >/dev/null 2>&1; then ip link delete dev tun0; fi
    for family in -4 -6; do
      while ip "$family" rule del table 51820 2>/dev/null; do :; done
    done
    exec /gluetun-entrypoint
  post-rules.txt: |
    iptables -I FORWARD 1 -i vpnlink -o tun0 -j ACCEPT
    iptables -I FORWARD 1 -i tun0 -o vpnlink -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
---
apiVersion: v1
kind: Service
metadata:
  namespace: {{ $.Release.Namespace }}
  name: vpn-gateway
spec:
  selector: {app: vpn-gateway}
  ports:
    - {name: overlay, port: 1194, targetPort: 1194, protocol: UDP}
---
apiVersion: v1
kind: Service
metadata:
  namespace: {{ $.Release.Namespace }}
  name: vpn-admission
spec:
  selector: {app: vpn-admission}
  ports:
    - {name: https, port: 443, targetPort: 8443}
